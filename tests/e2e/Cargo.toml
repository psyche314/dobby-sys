[package]
name = "dobby-sys-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "dobby_e2e_jni"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dobby-sys-e2e"
path = "src/main.rs"

[features]
full-floating-point-register-pack = ["dobby-sys/full-floating-point-register-pack"]

[dependencies]
dobby-sys = { path = "../.." }

[build-dependencies]
cc = "1.2"
